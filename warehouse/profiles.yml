# dbt profile for local DuckDB. The default path is relative to the warehouse/ dir;
# Dagster sets DBT_DUCKDB_PATH to build a copy that it swaps in after the tests pass.
cryptostream:
  target: dev
  outputs:
    dev:
      type: duckdb
      path: "{{ env_var('DBT_DUCKDB_PATH', '../data/warehouse/crypto.duckdb') }}"
      threads: 4
