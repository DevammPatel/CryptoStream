# CryptoStream — full local real-time data platform.
# Everything here runs free on your laptop. `docker compose up -d` starts the stack.

services:
  # ---------------------------------------------------------------------------
  # Redpanda — Kafka-compatible broker (lighter than Kafka for local dev)
  # ---------------------------------------------------------------------------
  redpanda:
    image: redpandadata/redpanda:v24.1.7
    container_name: cs-redpanda
    command:
      - redpanda
      - start
      - --smp=1
      - --overprovisioned
      - --node-id=0
      - --check=false
      - --kafka-addr=PLAINTEXT://0.0.0.0:29092,OUTSIDE://0.0.0.0:9092
      - --advertise-kafka-addr=PLAINTEXT://redpanda:29092,OUTSIDE://localhost:9092
    ports:
      - "9092:9092"
      - "29092:29092"
    volumes:
      # Keeps topics and offsets across restarts. Spark's checkpoints in the lake point
      # at these offsets, so the two must survive or be wiped together (`make clean`).
      - redpanda-data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Redpanda Console — nice UI to inspect topics/messages (great for demos)
  console:
    image: redpandadata/console:v2.6.0
    container_name: cs-console
    depends_on:
      - redpanda
    ports:
      - "8085:8080"
    environment:
      KAFKA_BROKERS: redpanda:29092

  # Create the topics up front: auto-creation would give them one partition.
  # rpk has no --if-not-exists here, so an existing topic falls through to describe.
  # Live bars keep one hour, which is what the API replays to rebuild after a restart.
  redpanda-init:
    image: redpandadata/redpanda:v24.1.7
    container_name: cs-redpanda-init
    depends_on:
      redpanda:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        (rpk topic create ${TRADES_TOPIC:-crypto.trades} -p 3 -r 1 -X brokers=redpanda:29092
        || rpk topic describe ${TRADES_TOPIC:-crypto.trades} -X brokers=redpanda:29092)
        && (rpk topic create ${BARS_TOPIC:-crypto.bars_10s} -p 3 -r 1 -c retention.ms=3600000 -X brokers=redpanda:29092
        || rpk topic describe ${BARS_TOPIC:-crypto.bars_10s} -X brokers=redpanda:29092)

  # ---------------------------------------------------------------------------
  # SeaweedFS — S3-compatible object store used as the raw data lake.
  # `mini` runs every SeaweedFS component in one process and creates the bucket.
  # ---------------------------------------------------------------------------
  seaweedfs:
    image: chrislusf/seaweedfs:4.52
    container_name: cs-seaweedfs
    command: ["mini", "-dir=/data", "-bucket=${LAKE_BUCKET:-crypto-lake}"]
    environment:
      AWS_ACCESS_KEY_ID: ${LAKE_ACCESS_KEY:-lakeadmin}
      AWS_SECRET_ACCESS_KEY: ${LAKE_SECRET_KEY:-lakeadmin}
    ports:
      - "8333:8333"   # S3 API
      - "8888:8888"   # file browser
    volumes:
      - lake-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://127.0.0.1:8333/healthz"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ---------------------------------------------------------------------------
  # Ingestion — Binance WebSocket → Redpanda
  # ---------------------------------------------------------------------------
  ingestion:
    build: ./ingestion
    container_name: cs-ingestion
    depends_on:
      redpanda-init:
        condition: service_completed_successfully
    environment:
      KAFKA_BOOTSTRAP: redpanda:29092
      SYMBOLS: ${SYMBOLS:-btcusdt,ethusdt,solusdt}
      TRADES_TOPIC: ${TRADES_TOPIC:-crypto.trades}
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Spark Structured Streaming — feature computation + write to lake
  # ---------------------------------------------------------------------------
  spark:
    build: ./streaming
    container_name: cs-spark
    depends_on:
      redpanda-init:
        condition: service_completed_successfully
      seaweedfs:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP: redpanda:29092
      TRADES_TOPIC: ${TRADES_TOPIC:-crypto.trades}
      BARS_TOPIC: ${BARS_TOPIC:-crypto.bars_10s}
      LAKE_ENDPOINT: http://seaweedfs:8333
      LAKE_ACCESS_KEY: ${LAKE_ACCESS_KEY:-lakeadmin}
      LAKE_SECRET_KEY: ${LAKE_SECRET_KEY:-lakeadmin}
      LAKE_BUCKET: ${LAKE_BUCKET:-crypto-lake}
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # MLflow — experiment tracking + model registry
  # ---------------------------------------------------------------------------
  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.14.1
    container_name: cs-mlflow
    command: >
      mlflow server
      --host 0.0.0.0 --port 5000
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --serve-artifacts
      --artifacts-destination /mlflow/artifacts
    ports:
      - "5001:5000"   # 5000 is taken by AirPlay on macOS
    volumes:
      - mlflow-data:/mlflow

  # ---------------------------------------------------------------------------
  # Dagster — scheduled batch layer: lake -> dbt -> model -> summary
  # ---------------------------------------------------------------------------
  dagster:
    build:
      context: .
      dockerfile: orchestration/Dockerfile
    container_name: cs-dagster
    depends_on:
      seaweedfs:
        condition: service_healthy
      mlflow:
        condition: service_started
    environment:
      LAKE_URI: s3://${LAKE_BUCKET:-crypto-lake}/features/ohlcv_10s
      LAKE_ENDPOINT: http://seaweedfs:8333
      LAKE_ACCESS_KEY: ${LAKE_ACCESS_KEY:-lakeadmin}
      LAKE_SECRET_KEY: ${LAKE_SECRET_KEY:-lakeadmin}
      DUCKDB_PATH: /data/warehouse/crypto.duckdb
      MODEL_DIR: /models
      MLFLOW_TRACKING_URI: http://mlflow:5000
    ports:
      - "3000:3000"
    volumes:
      - warehouse-data:/data
      - models-data:/models
      - dagster-data:/opt/dagster
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # FastAPI — model serving
  # ---------------------------------------------------------------------------
  api:
    build: ./ml
    container_name: cs-api
    depends_on:
      redpanda-init:
        condition: service_completed_successfully
      mlflow:
        condition: service_started
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      DUCKDB_PATH: /data/warehouse/crypto.duckdb
      MODEL_DIR: /models
      KAFKA_BOOTSTRAP: redpanda:29092
      BARS_TOPIC: ${BARS_TOPIC:-crypto.bars_10s}
    ports:
      - "8000:8000"
    volumes:
      - warehouse-data:/data
      - models-data:/models
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Streamlit — live dashboard
  # ---------------------------------------------------------------------------
  dashboard:
    build:
      context: .
      dockerfile: dashboard/Dockerfile
    container_name: cs-dashboard
    depends_on:
      - api
    environment:
      API_URL: http://api:8000
      DUCKDB_PATH: /data/warehouse/crypto.duckdb
    ports:
      - "8501:8501"
    volumes:
      - warehouse-data:/data
    restart: unless-stopped

volumes:
  redpanda-data:
  lake-data:
  mlflow-data:
  warehouse-data:
  models-data:
  dagster-data:
